<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">The Closed Eye</title>
  <desc id="desc">A polished disc carved as a shut eye, removed from the deepest sealed door. Since then, the carving has begun to open.</desc>
