<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Chain of Nine Names</title>
  <desc id="desc">Nine iron nameplates linked together; eight names translate as traitors. Nobody agrees on the meaning of the ninth.</desc>
