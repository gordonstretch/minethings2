  <path d="M102 121 140 153v62l-38-30Z" fill="#b6a587" stroke="#48382a" stroke-width="6" stroke-linejoin="round"/>
  <path d="M140 149h501v67q0 12-12 12H153q-13 0-13-13Z" fill="url(#mattress-front)" stroke="#48382a" stroke-width="6"/>
  <path d="M113 105h481q19 0 31 14l20 22q8 9-7 12H145q-13 0-23-10l-24-22q-11-16 15-16Z" fill="#f4ead5" stroke="#48382a" stroke-width="6" stroke-linejoin="round"/>
