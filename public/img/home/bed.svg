<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Council-standard wooden bed</title>
  <desc id="desc">A clearly constructed wooden bed with a slatted headboard, raised frame, cream mattress, pillow, and a patterned quilt tucked over the mattress.</desc>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c5b2f"/>
      <stop offset="0.48" stop-color="#6b381f"/>
      <stop offset="1" stop-color="#3b2115"/>
    </linearGradient>
    <linearGradient id="mattress-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dfc9"/>
      <stop offset="0.72" stop-color="#cab99a"/>
      <stop offset="1" stop-color="#a89676"/>
    </linearGradient>
    <linearGradient id="pillow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9eb"/>
      <stop offset="0.7" stop-color="#e1d7c3"/>
      <stop offset="1" stop-color="#b9a98d"/>
    </linearGradient>
    <pattern id="quilt" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="skewX(-5)">
      <rect width="56" height="56" fill="#b45136"/>
      <path d="M0 0 28 28 0 56ZM56 0 28 28 56 56Z" fill="#315f62"/>
      <path d="M0 0h14l42 42v14H42L0 14ZM42 0h14v14L14 56H0V42Z" fill="#dc9b3c"/>
      <path d="m28 18 10 10-10 10-10-10Z" fill="#f0c15c"/>
    </pattern>
    <filter id="bed-shadow" x="-20%" y="-30%" width="150%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <ellipse cx="373" cy="263" rx="310" ry="22" fill="#080706" opacity=".5" filter="url(#bed-shadow)"/>

  <g stroke="#2d190f" stroke-width="6" stroke-linejoin="round">
