<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Ghost Ship</title>
  <desc id="desc">A spectral sailing ship rising through luminous haunted waves.</desc>
  <defs>
